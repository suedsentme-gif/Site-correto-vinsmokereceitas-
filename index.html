<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JC UP STORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff}
header{background:#111;padding:20px;text-align:center;position:sticky;top:0;z-index:100}
header h1{color:#ff7a00;font-size:36px;display:inline-block;padding-bottom:6px;border-bottom:2px solid #fff}
nav{margin-top:10px}
nav button{background:none;border:none;color:#fff;margin:0 12px;font-weight:bold;font-size:16px;cursor:pointer}
nav button:hover{color:#ff7a00}
nav button.active{color:#ff7a00;border-bottom:2px solid #ff7a00}
.banner{background:linear-gradient(135deg,#000,#111,#ff7a00);color:#fff;padding:80px 20px;text-align:center}
.banner h2{font-size:38px;margin-bottom:10px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.banner p{font-size:18px;opacity:.95}
.section{display:none;padding:60px 20px;max-width:1100px;margin:auto}
.section.active{display:block}
.section h2{color:#ff7a00;text-align:center;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:#111;border:1px solid #ff7a00;border-radius:12px;padding:25px}
footer{background:#111;text-align:center;padding:15px;margin-top:30px;font-size:14px}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25d366;color:#fff;padding:15px 18px;border-radius:50px;font-weight:bold;text-decoration:none;z-index:1000}

/* Lista vertical de cards */
.list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 600px;
  margin: auto;
}

/* ==========================
   ACESSIBILIDADE MOBILE
   (SEM ALTERAR CONTEÚDO)
========================== */
@media (max-width: 768px) {

  body{
    font-size:16px;
  }

  header h1{
    font-size:26px;
  }

  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  nav button{
    font-size:14px;
    margin:4px;
  }

  .banner{
    padding:50px 15px;
  }

  .banner h2{
    font-size:26px;
  }

  .banner p{
    font-size:16px;
  }

  .section{
    padding:40px 15px;
  }

  .section h2{
    font-size:24px;
  }

  .card{
    padding:18px;
  }

  .card p{
    font-size:15px;
    line-height:1.5;
  }

  .list{
    max-width:100%;
  }

  .whatsapp{
    padding:14px 16px;
    font-size:14px;
    bottom:15px;
    right:15px;
  }
}
</style>
</head>
<body>

<a class="whatsapp" href="https://wa.me/5548991399378" target="_blank">💬 WhatsApp</a>

<header>
<h1><span style="letter-spacing:3px;">JC</span> <span style="color:#fff;">UP</span> <span style="letter-spacing:3px;">STORE</span></h1>
<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('assistencia')">Assistência</button>
<button onclick="showPage('celulares')">Celulares</button>
<button onclick="showPage('acessorios')">Acessórios</button>
<button onclick="showPage('contato')">Contato</button>
</nav>
</header>

<!-- TODO O RESTO DO SEU HTML ORIGINAL CONTINUA
     EXATAMENTE IGUAL AO QUE VOCÊ ENVIOU -->
     
<script>
function showPage(page){
  const sections = document.querySelectorAll('.section');
  const buttons = document.querySelectorAll('nav button');
  sections.forEach(s => s.classList.remove('active'));
  buttons.forEach(b => b.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.querySelector(`nav button[onclick="showPage('${page}')"]`).classList.add('active');
  window.scrollTo(0,0);
}
</script>

</body>
</html>
